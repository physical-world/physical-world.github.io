<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- PhysiCalWorld favicon: a single large globe (world model). Old globe + ruler version: favicon-globe-ruler.svg -->
  <defs>
    <!-- Pale sky-blue tile, top-left -> bottom-right. Darken stops for a stronger tile. -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f9fe"/>
      <stop offset="1" stop-color="#d6ebf9"/>
    </linearGradient>
  </defs>
  <!-- Background tile; rx = corner roundness (0 = square, 32 = circle).
       Thin edge stroke keeps the pale tile visible on white tabs (stroke-width="0" removes it). -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15" fill="url(#g)" stroke="#bcdcf2" stroke-width="1.5"/>
  <!-- Line color for the globe; stroke-linecap="round" gives soft line ends. -->
  <g fill="none" stroke="#2f8fd0" stroke-linecap="round">
    <!-- Globe: r = size (bigger = larger globe, max ~29 before touching the tile edge), cx/cy = center (32,32 = centered).
         If you change r or cy, also update the ellipse ry/cy and the equator x1/x2 (= 32 ± r) and y1/y2. -->
    <circle cx="32" cy="32" r="23" stroke-width="3"/>
    <!-- Meridian + equator; rx = meridian width (bigger = rounder), stroke-opacity sets how faint they are vs. the outline. -->
    <ellipse cx="32" cy="32" rx="9.6" ry="23" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="9" y1="32" x2="55" y2="32" stroke-width="2" stroke-opacity="0.6"/>
  </g>
</svg>
