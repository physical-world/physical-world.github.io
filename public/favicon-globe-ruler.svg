<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- PhysiCalWorld favicon: a globe (world model) above a ruler (calibration). -->
  <defs>
    <!-- Pale sky-blue tile, top-left -> bottom-right. Darken stops for a stronger tile. -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f9fe"/>
      <stop offset="1" stop-color="#d6ebf9"/>
    </linearGradient>
  </defs>
  <!-- Background tile; rx = corner roundness (0 = square, 32 = circle).
       Thin edge stroke keeps the pale tile visible on white tabs (stroke-width="0" removes it). -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15" fill="url(#g)" stroke="#bcdcf2" stroke-width="1.5"/>
  <!-- Line color for globe + ruler; stroke-linecap="round" gives soft line ends. -->
  <g fill="none" stroke="#2f8fd0" stroke-linecap="round">
    <!-- Globe: r = size (bigger = larger globe), cy = vertical position (smaller = higher).
         If you change r or cy, also update the ellipse ry/cy and the equator x1/x2 (= 32 ± r) and y1/y2. -->
    <circle cx="32" cy="25" r="17" stroke-width="2.4"/>
    <!-- Meridian + equator; stroke-opacity sets how faint they are vs. the outline. -->
    <ellipse cx="32" cy="25" rx="7.1" ry="17" stroke-width="1.6" stroke-opacity="0.6"/>
    <line x1="15" y1="25" x2="49" y2="25" stroke-width="1.6" stroke-opacity="0.6"/>
    <!-- Ruler body: y = top edge, height = thickness, x/width = left edge / length. -->
    <rect x="15" y="47" width="34" height="8" rx="2.5" fill="#e9f4fc" stroke-width="2.2"/>
    <!-- Ruler ticks hanging from the top edge (y=47); the v-values are tick lengths (long / mid / short). -->
    <path d="M19 47v4M22.25 47v2.2M25.5 47v3M28.75 47v2.2M32 47v4M35.25 47v2.2M38.5 47v3M41.75 47v2.2M45 47v4" stroke-width="1.5"/>
  </g>
</svg>
